name: Sorokeep TTL Check

on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:

jobs:
  check-ttl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Sorokeep Check
        uses: stellar/sorokeep/action@main
        with:
          config-path: ./sorokeep.config.yaml
